name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # Сайт живёт на своём домене yurabarinov.ru, то есть в корне "/".
        # Для проверки на адресе jura1223.github.io/BarinovFull/ (когда домен отключён)
        # задайте переменную репозитория PAGES_BASE_PATH = "/BarinovFull/".
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
